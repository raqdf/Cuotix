services:
  - type: web
    name: cuotix
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: ENABLE_REMOTE_LOCAL_ADMIN
        sync: false
      - key: LOCAL_ADMIN_EMAIL
        sync: false
      - key: LOCAL_ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
